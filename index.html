<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="./guard-espace.js?v=1"></script>
  <title>Mon Espace PRO — DIGIY</title>
  <meta name="theme-color" content="#022c22"/>

  <style>
    :root{
      --bg:#022c22;--bg2:#065f46;--card:#052e16;
      --accent:#facc15;--text:#e5e7eb;--muted:#9ca3af;
      --danger:#f97373;--ok:#22c55e;
      --line:rgba(148,163,184,.28);
      --glass:rgba(2,44,34,.35);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.10), transparent 55%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      color:var(--text);padding:20px;
    }
    .card{
      max-width:1080px;width:100%;
      background:linear-gradient(145deg,rgba(5,46,22,.97),rgba(6,95,70,.96));
      border-radius:26px;border:1px solid rgba(15,118,110,.45);
      padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.7);
    }
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .left{display:flex;gap:12px;align-items:center}
    .ico{
      width:52px;height:52px;border-radius:50%;
      display:grid;place-items:center;
      background:radial-gradient(circle at 30% 0,#facc15,transparent 55%);
      color:#022c22;font-size:24px;font-weight:900;
      border:1px solid rgba(250,204,21,.35);
      box-shadow:0 0 20px rgba(250,204,21,.15);
    }
    h1{font-size:14px;letter-spacing:.14em}
    .subtitle{font-size:12px;color:var(--muted)}
    .pill{
      border:1px solid var(--line);
      background:rgba(250,204,21,.12);
      padding:8px 12px;border-radius:999px;
      font-weight:900;font-size:12px;cursor:pointer;
      user-select:none;
    }
    .pill:hover{border-color:rgba(250,204,21,.55)}
    .sep{height:1px;background:var(--line);margin:14px 0}
    #status{font-size:14px;color:var(--muted);font-weight:800}
    #mini{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
    .ok{color:var(--ok)}
    .err{color:var(--danger)}
    .grid{
      display:grid;
      gap:10px;
      margin-top:14px;
      grid-template-columns:1fr;
    }
    @media (min-width:760px){
      .grid{grid-template-columns:1fr 1fr}
    }
    .btn{
      width:100%;padding:14px;
      background:var(--glass);border:1px solid var(--line);
      border-radius:16px;color:var(--text);
      display:flex;justify-content:space-between;align-items:center;
      cursor:pointer;font-weight:900;text-align:left;
    }
    .btn:hover{border-color:rgba(250,204,21,.6)}
    .tag{
      padding:6px 10px;border-radius:999px;
      background:rgba(250,204,21,.12);
      border:1px solid rgba(250,204,21,.35);
      font-size:12px;font-weight:900;white-space:nowrap;
    }
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .smallbtn{
      flex:1;min-width:220px;
      padding:12px 14px;border-radius:14px;
      background:rgba(0,0,0,.18);
      border:1px solid var(--line);
      color:var(--text);
      font-weight:900;cursor:pointer;
    }
    .smallbtn:hover{border-color:rgba(250,204,21,.55)}
    .note{
      margin-top:12px;
      padding:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.12);
      border-radius:14px;
      color:rgba(229,231,235,.86);
      font-size:12px;line-height:1.5
    }
    .code{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;opacity:.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="left">
        <div class="ico">🦅</div>
        <div>
          <h1>MON ESPACE PRO DIGIY</h1>
          <div class="subtitle" id="subtitle">Accès PRO</div>
        </div>
      </div>
      <div class="pill" id="logout">Déconnexion</div>
    </div>

    <div class="sep"></div>

    <div id="status">Chargement…</div>
    <div id="mini"></div>

    <div class="row" id="quick" style="display:none">
      <button class="smallbtn" id="btnInscription">➕ Ajouter un module</button>
      <button class="smallbtn" id="btnRefresh">🔄 Actualiser</button>
    </div>

    <div class="grid" id="modules"></div>

    <div class="note">
      <b>Règle DIGIY :</b> cet espace est le <b>rond-point central</b> des boulevards métiers.<br>
      Il mémorise le <b>phone</b>, garde les <b>slug</b> par module, et ne transmet un <b>slug</b> que s’il correspond réellement au boulevard visé.<br>
      <span class="code">phone + slug(module-compatible)</span>
    </div>
  </div>

  <script>
    (async function () {
      const ENTRY_URL = "https://commencer-a-payer.digiylyfe.com/";

      const MODULES = [
        {
          code: "DRIVER",
          title: "🚗 DRIVER PRO",
          sub: "Chauffeur — cockpit direct",
          url: "https://beauville.github.io/digiy-driver-pro/pin.html",
          slugPrefix: "driver-"
        },
        {
          code: "LOC",
          title: "🏠 LOC PRO",
          sub: "Hébergement — planning + pulse",
          url: "https://beauville.github.io/digiy-loc-pro/pin.html",
          slugPrefix: "loc-"
        },
        {
          code: "RESA",
          title: "🍽️ RESA TABLE PRO",
          sub: "Restaurant — réservations + tables",
          url: "https://pro-resa-resto.digiylyfe.com/pin.html",
          slugPrefix: "resa-"
        },
        {
          code: "CAISSE",
          title: "🧾 CAISSE PRO",
          sub: "Encaissement — tickets + ventes",
          url: "https://pro-caisse.digiylyfe.com/",
          slugPrefix: "pos-"
        },
        {
          code: "PAY",
          title: "💳 PAY PRO",
          sub: "Paiements — suivi + activations",
          url: "https://pay.digiylyfe.com/",
          slugPrefix: "pay-"
        },
        {
          code: "MARKET",
          title: "🛒 MARKET PRO",
          sub: "Boutique — catalogue + commandes",
          url: "https://beauville.github.io/digiy-market-pro/pin.html",
          slugPrefix: "market-"
        },
        {
          code: "BUILD",
          title: "🏗️ BUILD PRO",
          sub: "Artisans — devis terrain",
          url: "https://beauville.github.io/digiy-build-pro/pin.html",
          slugPrefix: "build-"
        },
        {
          code: "JOBS",
          title: "💼 JOBS PRO",
          sub: "Emploi — accompagnement",
          url: "https://beauville.github.io/digiy-jobs-pro/pin.html",
          slugPrefix: "jobs-"
        },
        {
          code: "EXPLORE",
          title: "🧭 EXPLORE PRO",
          sub: "Tourisme — spots + boost",
          url: "https://beauville.github.io/digiy-explore/pin.html",
          slugPrefix: "explore-"
        },
        {
          code: "FRET_CLIENT",
          title: "📦 FRET CLIENT PRO",
          sub: "Expédition — demandes client",
          url: "https://pro-fret-client.digiylyfe.com/pin.html",
          slugPrefix: "fret-client-"
        },
        {
          code: "FRET_CHAUFFEUR",
          title: "🛻 FRET CHAUFFEUR PRO",
          sub: "Chauffeur fret — trajets + statut",
          url: "https://pro-fret-chauffeur.digiylyfe.com/pin.html",
          slugPrefix: "fret-driver-"
        }
      ];

      const statusEl   = document.getElementById("status");
      const miniEl     = document.getElementById("mini");
      const gridEl     = document.getElementById("modules");
      const quickEl    = document.getElementById("quick");
      const subtitleEl = document.getElementById("subtitle");
      const logoutEl   = document.getElementById("logout");
      const btnRefresh = document.getElementById("btnRefresh");
      const btnInsc    = document.getElementById("btnInscription");

      const LS_PHONE = "digiy_phone";
      const LS_SLUG = "digiy_slug";
      const LS_MODULE_SLUGS = "digiy_module_slugs";

      function normPhone(p){
        let s = String(p || "").trim();
        s = s.replace(/[^\d+]/g, "");
        if (!s) return "";
        if (!s.startsWith("+") && s.startsWith("221")) s = "+" + s;
        return s;
      }

      function normSlug(s){
        return String(s || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-]/g, "")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function getStoredPhone(){
        return normPhone(localStorage.getItem(LS_PHONE) || "");
      }

      function getStoredSlug(){
        return normSlug(localStorage.getItem(LS_SLUG) || "");
      }

      function readModuleSlugs(){
        try{
          const raw = localStorage.getItem(LS_MODULE_SLUGS);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        }catch(_){
          return {};
        }
      }

      function clearSession(){
        try{
          if (window.DIGIY_ESPACE && typeof window.DIGIY_ESPACE.clearSession === "function") {
            window.DIGIY_ESPACE.clearSession();
            return;
          }
        }catch(_){}

        localStorage.removeItem(LS_PHONE);
        localStorage.removeItem(LS_SLUG);
        localStorage.removeItem(LS_MODULE_SLUGS);
      }

      function slugMatchesModule(slug, moduleObj){
        const s = normSlug(slug);
        if (!s || !moduleObj || !moduleObj.slugPrefix) return false;
        return s.startsWith(String(moduleObj.slugPrefix).toLowerCase());
      }

      function getBestSlugForModule(moduleObj){
        const moduleSlugs = readModuleSlugs();

        if (moduleSlugs[moduleObj.code] && slugMatchesModule(moduleSlugs[moduleObj.code], moduleObj)) {
          return moduleSlugs[moduleObj.code];
        }

        const genericSlug = getStoredSlug();
        if (slugMatchesModule(genericSlug, moduleObj)) {
          return genericSlug;
        }

        return "";
      }

      function buildEntryUrl(moduleCode){
        const u = new URL(ENTRY_URL);
        if (moduleCode) u.searchParams.set("module", moduleCode);

        const phone = getStoredPhone();
        if (phone) u.searchParams.set("phone", phone);

        return u.toString();
      }

      function buildModuleUrl(moduleObj){
        const dest = new URL(moduleObj.url);

        const phone = getStoredPhone();
        const slug = getBestSlugForModule(moduleObj);

        if (phone) dest.searchParams.set("phone", phone);
        if (slug) dest.searchParams.set("slug", slug);

        return dest.toString();
      }

      function go(url){
        location.href = url;
      }

      function addCard({ title, sub, tag = "ENTRER", onClick }){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.innerHTML = `
          <div>
            <div style="font-size:14px">${title}</div>
            <div style="font-size:12px;opacity:.75;margin-top:4px">${sub}</div>
          </div>
          <span class="tag">${tag}</span>
        `;
        btn.addEventListener("click", onClick);
        gridEl.appendChild(btn);
      }

      try{
        if (window.DIGIY_ESPACE && window.DIGIY_ESPACE.ready) {
          await window.DIGIY_ESPACE.ready;
        }
      }catch(_){}

      const phone = getStoredPhone();
      const currentSlug = getStoredSlug();

      btnInsc.addEventListener("click", () => {
        go(buildEntryUrl(""));
      });

      btnRefresh.addEventListener("click", () => {
        location.reload();
      });

      logoutEl.addEventListener("click", () => {
        if (!confirm("Déconnexion ?")) return;
        clearSession();
        location.reload();
      });

      if (!phone) {
        subtitleEl.textContent = "Accès PRO";
        statusEl.innerHTML = "<span class='err'>Aucune session détectée</span>";
        miniEl.innerHTML = "Passe par l’inscription DIGIY pour créer ton espace PRO et ouvrir tes boulevards métiers.";
        gridEl.innerHTML = "";

        addCard({
          title: "📝 Aller à l’inscription",
          sub: "Créer ton accès + choisir ton module",
          tag: "OUVRIR",
          onClick: () => go(buildEntryUrl(""))
        });

        return;
      }

      subtitleEl.textContent = currentSlug
        ? `${phone} • ${currentSlug}`
        : `${phone} • téléphone détecté`;

      quickEl.style.display = "flex";
      statusEl.innerHTML = "<span class='ok'>Rond-point prêt</span>";

      if (currentSlug) {
        miniEl.innerHTML = "Choisis ton boulevard métier. Le <b>slug</b> ne part que s’il correspond au bon module 👑";
      } else {
        miniEl.innerHTML = "Choisis ton boulevard métier. Le <b>phone</b> est prêt, le <b>PIN</b> fera le reste 👑";
      }

      gridEl.innerHTML = "";

      MODULES.forEach((moduleObj) => {
        addCard({
          title: moduleObj.title,
          sub: moduleObj.sub,
          tag: "ENTRER",
          onClick: () => go(buildModuleUrl(moduleObj))
        });
      });
    })();
  </script>
</body>
</html>
